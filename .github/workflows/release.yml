name: Release

# Builds a standalone Windows .exe and attaches it to a GitHub Release.
# Trigger: push a tag like v1.0.0
#
#   git tag v1.0.0
#   git push origin v1.0.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build and publish (self-contained single file)
        run: |
          dotnet publish src/DshLauncher/DshLauncher.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarnessLauncher-win-x64
          path: publish/DeepSeekHarnessLauncher.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/DeepSeekHarnessLauncher.exe
          generate_release_notes: true
