name: CI

# Builds the project on every push / pull request so regressions are caught early.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/DshLauncher/DshLauncher.csproj

      - name: Build
        run: dotnet build src/DshLauncher/DshLauncher.csproj -c Release --no-restore
